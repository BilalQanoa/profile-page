<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <h1>Profile</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#profile">My Profile</a>
            <a href="#connections">Find Connections</a>
        </nav>

        <button>Sign Out</button>
    </header>

    <section class="content">

        <div class="col1">

            <div class="card">

                <div class="top-box">
                    <img src="images/img.png">
                </div>

                <div class="info-box">

                    <h2>Jane Doe</h2>

                    <h3 class="location">
                        <img class="map" src="icons/map-marker.png">
                        Seattle
                    </h3>

                    <p>
                        Developer | Engineer | Problem Solver <br>
                        Master of shadow and the Internet
                    </p>

                    <div class="edit-profile">
                        <img class="gear" src="icons/gear.png">
                        <a class="edit" href="#">edit profile</a>
                    </div>

                </div>

            </div>
            <div class="education">
                <h2 class="head-box">Education</h2>
                <div class="content-box">
                    <h2>University of Palestine - Software Engineer</h2>
                    <p>septemper 2020 - june 2025</p>
                    <h3>triple black built in python, MEREN and C# ...</h3>
                </div>
            </div>
        </div>

        <div class="col2">
            Col 2
        </div>

    </section>

</body>

</html>
